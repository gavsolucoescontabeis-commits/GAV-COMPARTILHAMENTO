name: Publicar GAV Compartilhamento

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gav-compartilhamento-pages
  cancel-in-progress: false

jobs:
  build:
    name: Preparar site estático
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar Python para os ícones
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preparar conversão do ícone GAV
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Preparar somente arquivos públicos
        run: |
          mkdir -p _site
          cp index.html portal.js portal-ui.css manifest.webmanifest sw.js version.json _site/
          cp -R assets _site/assets
          python scripts/build_gav_icons.py _site
          touch _site/.nojekyll
          printf '%s\n' "$GITHUB_SHA" > _site/revision.txt
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          html = Path("_site/index.html").read_text(encoding="utf-8")
          js = Path("_site/portal.js").read_text(encoding="utf-8")
          release = json.loads(Path("_site/version.json").read_text(encoding="utf-8"))
          html_version = re.search(r'portal\.js\?v=(\d+\.\d+\.\d+)', html)
          js_version = re.search(r'GAV_PORTAL_VERSION\s*=\s*"(\d+\.\d+\.\d+)"', js)
          if not html_version or not js_version or not (
              html_version.group(1) == js_version.group(1) == release.get("version")
          ):
              raise SystemExit("Versões diferentes entre index.html, portal.js e version.json")
          print("GAV Compartilhamento v" + html_version.group(1))
          PY
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publicar GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
