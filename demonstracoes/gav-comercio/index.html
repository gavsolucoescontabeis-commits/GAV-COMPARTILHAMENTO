<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24536b"><title>GAV Comércio • Demonstração</title>
<style>
:root{--main:#24536b;--deep:#17394d;--gold:#ba913f;--bg:#f2f5f7;--border:#dfe6eb;--ink:#213441;--sub:#667985;--red:#b45355;--good:#2b8064}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
.layout{display:flex;min-height:100svh}.side{width:247px;flex-shrink:0;background:linear-gradient(160deg,#24516a,#17364d);color:#fff;padding:26px 14px 18px;display:flex;flex-direction:column;gap:15px}
.brand{margin:0 10px 14px}.brand b{font-family:Georgia,serif;font-size:30px;letter-spacing:3px;color:#d2b36e}.brand b span{color:#fff}.brand small{display:block;letter-spacing:2.2px;font-size:9px;font-weight:800}.side label{display:block;color:#c3d3df;font-size:10px;font-weight:800;margin-bottom:6px;letter-spacing:1px}.select-company{background:#fff;color:#253746;padding:11px 7px;border-radius:9px;width:100%;border:0;min-width:0}
nav{display:grid;gap:3px}nav button{border:0;background:transparent;color:#d9e7ee;text-align:left;padding:11px 12px;border-radius:9px;font-size:13px;font-weight:550}
nav button.active,nav button:hover{background:#ffffff26;color:#fff}.foot{margin-top:auto;border-top:1px solid #ffffff2b;padding:16px 10px;color:#b5cad9;font-size:11px}
.main{flex:1;min-width:0}.top{height:67px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 24px}
.top strong{font-size:15px}.grow{flex:1}.demo{background:#fff4df;color:#9a6a1d;border:1px solid #f5daa1;border-radius:100px;padding:5px 10px;font-weight:800;font-size:10px;letter-spacing:.4px}
.top button{border:1px solid var(--border);background:#fff;padding:7px 10px;border-radius:8px}.mobile{display:none}
.content{max-width:1450px;margin:auto;padding:31px 35px 70px}.intro{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:24px}.kicker{font-size:10px;color:#ad8641;font-weight:900;letter-spacing:1.5px}.intro h1{font-size:28px;letter-spacing:-.7px;margin:3px 0}.intro p{margin:0;color:var(--sub)}
.btn{background:var(--main);color:#fff;border:0;border-radius:9px;padding:10px 15px;font-weight:750}.btn.gold{background:var(--gold);color:#142a36}.btn.light{color:var(--main);background:#ebf2f6}.btn.outline{color:var(--main);background:#fff;border:1px solid var(--border)}.btn.tiny{padding:6px 10px;font-size:12px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:19px 0}.metric,.card{background:#fff;border:1px solid var(--border);border-radius:13px;box-shadow:0 2px 7px #1e38470a}.metric{padding:18px}.metric .lab{font-size:11px;color:var(--sub);font-weight:700}.metric .val{font-size:24px;font-weight:850;margin-top:9px;letter-spacing:-.7px}.metric .hint{font-size:11px;color:var(--sub);margin-top:3px}
.card{padding:19px;margin:17px 0}.card h2{font-size:15px;margin:0 0 17px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.grid2>.card{margin:0}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:#748390;background:#f7fafb}th,td{padding:12px 9px;border-bottom:1px solid #eaf0f2}td{font-size:12px}tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}.scroll table{min-width:520px}.muted{color:var(--sub)}.tag{display:inline-block;padding:4px 8px;border-radius:6px;background:#e9f5ed;color:#267655;font-size:10px;font-weight:800}.tag.warn{background:#fff1df;color:#b16b26}
.notice{padding:12px 16px;border-radius:10px;background:#edf6fa;border:1px solid #cfe4ec;color:#326079;font-size:12px;margin:15px 0}.notice.warn{background:#fff5ee;border-color:#f1ddc7;color:#9c6d3e}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.toolbar h2{margin:0}.search{width:240px;max-width:100%;border:1px solid var(--border);border-radius:9px;padding:9px;background:#fff}
.catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.product{background:#fff;border:1px solid #d8e4e9;padding:13px;border-radius:10px;text-align:left;min-height:103px}.product b{display:block;font-size:13px}.product small{display:block;color:#69808c;margin:4px 0 8px}.product strong{color:#295876}
.pos{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.pos>.card{margin:0}.cartline{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border)}.cartline .qty{display:flex;gap:9px;align-items:center}.cartline button{border:1px solid var(--border);background:#f5f8fa;border-radius:6px;padding:3px 9px}.total{display:flex;justify-content:space-between;align-items:center;font-weight:850;font-size:21px;margin:19px 0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.span{grid-column:1/-1}.field label{font-size:11px;font-weight:800;color:#566875}.field input,.field select{width:100%;border:1px solid #d7e1e5;border-radius:8px;background:#fff;padding:11px;color:var(--ink);min-width:0}
.formbtn{margin-top:14px;width:100%}.empty{color:#84939b;text-align:center;padding:28px 10px}.soft{font-size:12px;color:var(--sub)}.actions{display:flex;gap:7px;flex-wrap:wrap}
#overlay{display:none;position:fixed;inset:0;background:#0d2235ac;z-index:99;align-items:center;justify-content:center;padding:14px}#overlay.show{display:flex}.modal{background:#fff;border-radius:13px;width:min(550px,100%);max-height:90svh;overflow-y:auto;padding:22px}.modal h2{margin:0 0 14px;font-size:20px}.modalhead{display:flex;align-items:center;justify-content:space-between}.close{background:#f0f3f4;border:0;border-radius:7px;padding:4px 11px;font-size:20px}
.banner{font-weight:700;font-size:12px;background:#fdf3df;color:#936620;padding:9px 12px;border-radius:8px;margin-bottom:15px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:110;background:#203e4e;color:#fff;padding:10px 18px;border-radius:9px;display:none;max-width:90%;text-align:center}
@media(max-width:950px){.side{width:210px}.metrics{grid-template-columns:repeat(2,1fr)}.catalog{grid-template-columns:repeat(2,1fr)}.pos{grid-template-columns:1fr}.content{padding:22px 18px}}@media(max-width:680px){.side{display:none;position:fixed;inset:0 auto 0 0;z-index:88;width:270px;box-shadow:0 0 0 100vw #0008}.side.open{display:flex}.mobile{display:block}.top{height:60px;padding:0 12px}.top strong{font-size:13px}.top .demo{font-size:9px}.content{padding:21px 13px 65px}.intro{align-items:start;flex-direction:column}.intro h1{font-size:23px}.intro .actions{width:100%}.metrics{gap:9px}.metric{padding:13px}.metric .val{font-size:19px}.card{padding:14px}.grid2{grid-template-columns:1fr}.catalog{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.product{padding:11px}.fgrid{grid-template-columns:1fr}.field.span{grid-column:auto}}
</style></head><body><div class="layout">
<aside class="side" id="side"><div class="brand"><b>G<span>·</span>A<span>·</span>V</b><small>COMÉRCIO • WEB DEMO</small></div>
<div><label>EMPRESA SELECIONADA</label><select id="company" class="select-company" onchange="changeCompany(this.value)"></select></div>
<label style="margin:8px 0 0">MENU PRINCIPAL</label><nav id="nav"></nav><div class="foot">GAV SOLUÇÕES CONTÁBEIS<br>Protótipo de testes • Sem valor fiscal<br>Dados salvos apenas neste navegador</div></aside>
<div class="main"><header class="top"><button class="mobile" onclick="document.getElementById('side').classList.toggle('open')">☰</button><strong>GAV Comércio</strong><span class="muted">/ <span id="crumb">Visão Geral</span></span><span class="grow"></span><span class="demo">DEMONSTRAÇÃO</span></header><main id="content" class="content"></main></div></div>
<div id="overlay" onclick="if(event.target.id==='overlay')closeModal()"><section class="modal"><div class="modalhead"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></section></div><div id="toast"></div>
<script>
'use strict';
var KEY='gav_comercio_web_demo_01';
function initial(){return {companyId:1,companies:[{id:1,name:'Comércio Demonstração GAV',cnpj:'00.000.000/0001-00',city:'Curitiba',uf:'PR'},{id:2,name:'Segunda Empresa Demonstrativa',cnpj:'11.111.111/0001-11',city:'Londrina',uf:'PR'}],products:[{id:1,cid:1,sku:'001',name:'Camiseta Básica',price:59.9,cost:27,stock:32,min:5,ncm:'61091000'},{id:2,cid:1,sku:'002',name:'Calça Jeans',price:149.9,cost:76,stock:14,min:3,ncm:'62034200'},{id:3,cid:1,sku:'003',name:'Tênis Casual',price:219.9,cost:115,stock:9,min:3,ncm:'64041100'},{id:4,cid:1,sku:'004',name:'Boné Ajustável',price:39.9,cost:16,stock:24,min:4,ncm:'65050090'},{id:5,cid:1,sku:'005',name:'Meia Esportiva',price:19.9,cost:8,stock:48,min:10,ncm:'61159600'},{id:6,cid:2,sku:'F001',name:'Mochila Escolar',price:89.9,cost:40,stock:8,min:2,ncm:'42029200'},{id:7,cid:2,sku:'F002',name:'Estojo',price:24.9,cost:11,stock:21,min:5,ncm:'42023200'}],partners:[{id:1,cid:1,kind:'Cliente',name:'Consumidor Demonstrativo',document:''},{id:2,cid:1,kind:'Fornecedor',name:'Fornecedor Exemplo',document:''}],sales:[],purchases:[],finance:[],drafts:[],seq:20};}
var db;try{db=JSON.parse(localStorage.getItem(KEY))||initial();if(!db.companies||!db.products)db=initial();}catch(e){db=initial()}
var page='dashboard',cart=[],checkoutDiscount=0;
var tabs=[['dashboard','▦  Visão Geral'],['pos','▣  Frente de Caixa'],['products','▤  Produtos e Estoque'],['partners','♙  Clientes e Fornecedores'],['purchases','▥  Compras e Entradas'],['finance','▰  Financeiro'],['fiscal','▧  NF-e / NFC-e'],['reports','▥  Relatórios'],['companies','⚙  Empresas e Parâmetros']];
function el(id){return document.getElementById(id)}function fmt(n){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0)}function clean(t){return String(t==null?'':t).replace(/[&<>"']/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]})}
function num(n){return Number(n||0)}function round(n){return Math.round(n*100)/100}function day(){return new Date().toISOString().slice(0,10)}function dateFmt(s){return s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'—'}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function id(){db.seq++;return db.seq}function rows(kind){return db[kind].filter(function(x){return x.cid===db.companyId})}function product(pid){return db.products.find(function(p){return p.cid===db.companyId&&p.id===Number(pid)})}
function alertUser(s){el('toast').textContent=s;el('toast').style.display='block';setTimeout(function(){el('toast').style.display='none'},2800)}
function td(t){return '<td>'+t+'</td>'}function table(headers,content){return '<div class="scroll"><table><thead><tr>'+headers.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr></thead><tbody>'+(content||'<tr><td colspan="'+headers.length+'" class="empty">Nenhum registro.</td></tr>')+'</tbody></table></div>'}
function head(title,sub,actions){return '<div class="intro"><div><div class="kicker">GESTÃO COMERCIAL INTEGRADA</div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="actions">'+(actions||'')+'</div></div>'}
function card(title,body){return '<section class="card"><h2>'+title+'</h2>'+body+'</section>'}function btn(s,action,cls){return '<button class="btn '+(cls||'')+'" onclick="'+action+'">'+s+'</button>'}
function field(label,name,type,req,value){return '<div class="field"><label>'+label+'</label><input name="'+name+'" type="'+(type||'text')+'" '+(req?'required ':'')+'value="'+clean(value||'')+'"></div>'}
function pick(label,name,options){return '<div class="field"><label>'+label+'</label><select name="'+name+'">'+options+'</select></div>'}
function opts(list,valueKey,labelKey,empty){return (empty?'<option value="">'+empty+'</option>':'')+list.map(function(x){return '<option value="'+clean(x[valueKey])+'">'+clean(x[labelKey])+'</option>'}).join('')}
function modal(title,body){el('modalTitle').textContent=title;el('modalBody').innerHTML=body;el('overlay').classList.add('show')}
function closeModal(){el('overlay').classList.remove('show');el('modalBody').innerHTML=''}
function formStart(kind){return '<form onsubmit="submitForm(event,\''+kind+'\')"><div class="fgrid">'}function formEnd(){return '</div><button class="btn gold formbtn" type="submit">Salvar</button></form>'}
function changeCompany(cid){db.companyId=Number(cid);cart=[];save();render();el('side').classList.remove('open')}
function go(tab){page=tab;cart=tab==='pos'?cart:[];el('side').classList.remove('open');render();window.scrollTo(0,0)}
function render(){el('company').innerHTML=db.companies.map(function(c){return '<option value="'+c.id+'" '+(c.id===db.companyId?'selected':'')+'>'+clean(c.name)+'</option>'}).join('');
el('nav').innerHTML=tabs.map(function(x){return '<button class="'+(x[0]===page?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('');el('crumb').textContent=tabs.find(function(t){return t[0]===page})[1].replace(/^[^A-Za-zÀ-ú]+/,'');var html='';
if(page==='dashboard'){var sales=rows('sales'),products=rows('products'),fi=rows('finance'),total=sales.reduce(function(a,s){return a+s.total},0);
html=head('Visão Geral','Acompanhe vendas, estoque e financeiro da empresa selecionada.',btn('+ Nova Venda',"go('pos')",'gold'));
html+='<div class="metrics">'+metric('Faturamento registrado',fmt(total),'Vendas desta demonstração')+metric('Vendas realizadas',sales.length,'Operações concluídas')+metric('Produtos cadastrados',products.length,'Itens da empresa')+metric('A receber',fmt(fi.filter(function(f){return f.kind==='Receber'&&f.status==='Pendente'}).reduce(function(a,f){return a+f.amount},0)),'Valores pendentes')+'</div>';
html+='<div class="grid2">'+card('Estoque Baixo',table(['Produto','Saldo','Mínimo'],products.filter(function(p){return p.stock<=p.min}).map(function(p){return '<tr>'+td(clean(p.name))+td(p.stock)+td(p.min)+'</tr>'}).join('')))+card('Últimas Vendas',table(['Venda','Data','Total'],sales.slice(-5).reverse().map(function(s){return '<tr>'+td('#'+s.id)+td(dateFmt(s.date))+td(fmt(s.total))+'</tr>'}).join('')))+'</div>';html+='<div class="notice">Modo demonstração online: dados guardados somente no navegador deste celular. Nenhuma nota fiscal é transmitida.</div>';}
if(page==='pos'){html=head('Frente de Caixa','Venda com controle de estoque e registro no financeiro.');html+='<div class="pos">'+card('Produtos Disponíveis','<div class="catalog">'+rows('products').filter(function(p){return p.stock>0}).map(function(p){return '<button class="product" onclick="addCart('+p.id+')"><small>'+clean(p.sku)+'</small><b>'+clean(p.name)+'</b><strong>'+fmt(p.price)+'</strong><small>'+p.stock+' unidades em estoque</small></button>'}).join('')+'</div>')+card('Venda Atual',cartHtml())+'</div>';}
if(page==='products'){html=head('Produtos e Estoque','Controle de códigos, preços e quantidades.',btn('+ Novo Produto',"openForm('product')",'gold'));
html+=card('Produtos da Empresa',table(['Código','Descrição','Preço','Estoque','Ações'],rows('products').map(function(p){return '<tr>'+td(clean(p.sku))+td('<b>'+clean(p.name)+'</b><div class="soft">NCM '+clean(p.ncm||'—')+'</div>')+td(fmt(p.price))+td(p.stock<=p.min?'<span class="tag warn">'+p.stock+' un.</span>':p.stock+' un.')+td(btn('Editar',"openForm('editProduct',"+p.id+")",'tiny outline'))+'</tr>'}).join('')));}
if(page==='partners'){html=head('Clientes e Fornecedores','Cadastros exclusivos da empresa selecionada.',btn('+ Novo Cadastro',"openForm('partner')",'gold'));html+=card('Pessoas Cadastradas',table(['Tipo','Nome / Razão Social','Documento'],rows('partners').map(function(p){return '<tr>'+td(clean(p.kind))+td(clean(p.name))+td(clean(p.document||'—'))+'</tr>'}).join('')));}
if(page==='purchases'){html=head('Compras e Entradas','Registre entradas e atualize automaticamente o estoque.',btn('+ Registrar Entrada',"openForm('purchase')",'gold'));html+=card('Histórico de Entradas',table(['Data','Produto','Quantidade','Custo','Total'],rows('purchases').slice().reverse().map(function(p){return '<tr>'+td(dateFmt(p.date))+td(clean(p.productName))+td(p.qty)+td(fmt(p.cost))+td(fmt(p.total))+'</tr>'}).join('')));}
if(page==='finance'){var fs=rows('finance');html=head('Gestão Financeira','Controle de contas a pagar e receber.',btn('+ Novo Lançamento',"openForm('finance')",'gold'));html+='<div class="metrics">'+metric('A Receber',fmt(fs.filter(function(f){return f.kind==='Receber'&&f.status==='Pendente'}).reduce(function(a,f){return a+f.amount},0)),'Em aberto')+metric('A Pagar',fmt(fs.filter(function(f){return f.kind==='Pagar'&&f.status==='Pendente'}).reduce(function(a,f){return a+f.amount},0)),'Em aberto')+'</div>';html+=card('Lançamentos',table(['Descrição','Natureza','Valor','Vencimento','Situação / Ação'],fs.slice().reverse().map(function(f){return '<tr>'+td(clean(f.description))+td(f.kind)+td(fmt(f.amount))+td(dateFmt(f.due))+td(f.status==='Pago'?'<span class="tag">Pago</span>':btn('Dar baixa',"settle("+f.id+")",'tiny outline'))+'</tr>'}).join('')));}
if(page==='fiscal'){html=head('NF-e e NFC-e','Pré-emissão a partir das vendas. Apenas simulação, sem valor fiscal.',btn('+ Preparar Documento',"openForm('draft')",'gold'));html+='<div class="notice warn"><b>Emissão fiscal real ainda não disponível.</b> Não há autorização SEFAZ, assinatura A1, CSC, QR Code fiscal, XML autorizado ou DANFE.</div>';html+=card('Pré-emissões',table(['Número','Modelo','Venda','Situação','Ação'],rows('drafts').slice().reverse().map(function(d){return '<tr>'+td('#'+d.id)+td(d.model==='55'?'NF-e 55':'NFC-e 65')+td('#'+d.saleId)+td('<span class="tag warn">SIMULAÇÃO</span>')+td(btn('Visualizar',"viewDraft("+d.id+")",'tiny outline'))+'</tr>'}).join('')));}
if(page==='reports'){var ss=rows('sales'),ps=rows('products');var revenue=ss.reduce(function(a,s){return a+s.total},0),cost=ss.reduce(function(a,s){return a+s.items.reduce(function(v,i){return v+i.cost*i.qty},0)},0);html=head('Relatórios Gerenciais','Resumo das operações desta demonstração.',btn('Exportar Vendas CSV',"exportSales()",'outline'));html+='<div class="metrics">'+metric('Total de Vendas',fmt(revenue),'Faturamento')+metric('Custo das Vendas',fmt(cost),'Custo histórico')+metric('Margem Bruta Estimada',fmt(revenue-cost),'Antes de impostos')+metric('Valor em Estoque',fmt(ps.reduce(function(a,p){return a+p.stock*p.cost},0)),'Pelo custo registrado')+'</div>';html+='<div class="notice">A margem bruta não equivale ao lucro contábil ou fiscal. Não considera todos os custos, impostos ou despesas.</div>';html+=card('Resumo de Vendas',table(['Nº','Data','Pagamento','Total'],ss.slice().reverse().map(function(s){return '<tr>'+td('#'+s.id)+td(dateFmt(s.date))+td(clean(s.payment))+td(fmt(s.total))+'</tr>'}).join('')));}
if(page==='companies'){var c=db.companies.find(function(x){return x.id===db.companyId});html=head('Empresas e Parâmetros','Bases independentes por empresa.',btn('+ Nova Empresa',"openForm('company')",'gold'));html+=card('Empresa Selecionada','<b>'+clean(c.name)+'</b><p>CNPJ: '+clean(c.cnpj)+'</p><p>Município: '+clean(c.city)+' / '+clean(c.uf)+'</p>');html+=card('Ferramentas de Testes','<div class="actions">'+btn('Baixar Backup JSON',"backup()",'outline')+btn('Reiniciar Demonstração',"resetDemo()",'light')+'</div><p class="soft">Backup do navegador de testes, não é backup de servidor. Não cadastre dados pessoais reais.</p>');}
el('content').innerHTML=html}
function metric(label,val,hint){return '<div class="metric"><div class="lab">'+label+'</div><div class="val">'+val+'</div><div class="hint">'+hint+'</div></div>'}
function cartHtml(){var t=cart.reduce(function(a,x){return a+x.qty*x.price},0);return (cart.length?cart.map(function(x){return '<div class="cartline"><div><b>'+clean(x.name)+'</b><div class="soft">'+fmt(x.price)+'</div></div><div class="qty"><button onclick="cartQty('+x.id+',-1)">−</button><b>'+x.qty+'</b><button onclick="cartQty('+x.id+',1)">+</button></div></div>'}).join(''):'<div class="empty">Selecione os produtos ao lado para vender.</div>')+'<div class="total"><span>Total</span><span>'+fmt(t)+'</span></div><div class="fgrid"><div class="field"><label>Desconto R$</label><input type="number" id="discount" min="0" step=".01" value="0" onchange="checkoutDiscount=num(this.value)"></div>'+pick('Pagamento','payment','<option>Pix</option><option>Dinheiro</option><option>Cartão de Crédito</option><option>Cartão de Débito</option><option>Crediário</option>')+'</div><div class="field" style="margin-top:9px"><label>Cliente</label><select id="customer"><option value="">Consumidor não identificado</option>'+opts(rows('partners').filter(function(p){return p.kind==='Cliente'}),'id','name')+'</select></div><button class="btn gold formbtn" '+(!cart.length?'disabled':'')+' onclick="finalizeSale()">✓ Finalizar Venda</button><p class="soft">Operação de teste, sem cobrança ou emissão fiscal.</p>'}
function addCart(pid){var p=product(pid),x=cart.find(function(i){return i.id===pid});if(!p)return;if(x&&x.qty>=p.stock)return alertUser('Estoque insuficiente');if(x)x.qty++;else cart.push({id:p.id,name:p.name,price:p.price,cost:p.cost,qty:1});render()}
function cartQty(pid,d){var x=cart.find(function(i){return i.id===pid});if(!x)return;var p=product(pid);if(d>0&&x.qty>=p.stock)return alertUser('Estoque insuficiente');x.qty+=d;cart=cart.filter(function(i){return i.qty>0});render()}
function finalizeSale(){if(!cart.length)return;var discount=Number(el('discount').value)||0;var total=round(cart.reduce(function(a,x){return a+x.qty*x.price},0)-discount);if(discount<0||total<0)return alertUser('Desconto inválido');for(var i of cart){var p=product(i.id);if(!p||p.stock<i.qty)return alertUser('Estoque insuficiente para '+i.name)}
var payment=el('content').querySelector('select[name=payment]').value,customerId=num(el('customer').value),sid=id();for(var x of cart)product(x.id).stock-=x.qty;
db.sales.push({id:sid,cid:db.companyId,date:day(),total:total,payment:payment,customerId:customerId,items:cart.map(function(x){return {id:x.id,name:x.name,qty:x.qty,price:x.price,cost:x.cost}})});
db.finance.push({id:id(),cid:db.companyId,description:'Venda #'+sid,kind:'Receber',amount:total,due:day(),status:payment==='Crediário'?'Pendente':'Pago',saleId:sid});cart=[];save();render();alertUser('Venda #'+sid+' registrada na demonstração')}
function openForm(kind,pid){var html='',p=null;if(kind==='product'||kind==='editProduct'){p=kind==='editProduct'?product(pid):{};html=formStart(kind)+field('Código interno','sku','text',true,p.sku)+field('Descrição do Produto','name','text',true,p.name)+field('Preço de Venda (R$)','price','number',true,p.price)+field('Custo (R$)','cost','number',true,p.cost)+field('NCM','ncm','text',false,p.ncm)+(kind==='product'?field('Estoque Inicial','stock','number',true,0):'')+field('Estoque Mínimo','min','number',false,p.min||0)+'</div><input type="hidden" name="id" value="'+(pid||'')+'"><button class="btn gold formbtn">Salvar Produto</button></form>';}
if(kind==='partner')html=formStart(kind)+pick('Tipo','kind','<option>Cliente</option><option>Fornecedor</option>')+field('Nome / Razão Social','name','text',true)+field('CPF / CNPJ (opcional)','document','text',false)+formEnd();
if(kind==='purchase')html=formStart(kind)+pick('Produto','pid',opts(rows('products'),'id','name'))+field('Quantidade','qty','number',true,1)+field('Custo Unitário (R$)','cost','number',true,0)+formEnd();
if(kind==='finance')html=formStart(kind)+pick('Natureza','kind','<option>Receber</option><option>Pagar</option>')+field('Descrição','description','text',true)+field('Valor R$','amount','number',true)+field('Vencimento','due','date',true,day())+formEnd();
if(kind==='draft')html='<div class="banner">SIMULAÇÃO SEM VALOR FISCAL</div>'+formStart(kind)+pick('Modelo','model','<option value="65">NFC-e 65</option><option value="55">NF-e 55</option>')+pick('Venda','saleId',opts(rows('sales').filter(function(s){return !rows('drafts').some(function(d){return d.saleId===s.id})}).map(function(s){return {id:s.id,name:'Venda #'+s.id+' • '+fmt(s.total)}}),'id','name'))+formEnd();
if(kind==='company')html=formStart(kind)+field('Razão Social','name','text',true)+field('CNPJ (opcional)','cnpj','text',false)+field('Município','city','text',false)+field('UF','uf','text',false,'PR')+formEnd();
modal(kind==='product'?'Novo Produto':kind==='editProduct'?'Editar Produto':kind==='partner'?'Novo Cliente / Fornecedor':kind==='purchase'?'Entrada de Mercadorias':kind==='finance'?'Lançamento Financeiro':kind==='draft'?'Preparar Documento':'Nova Empresa',html)}
function submitForm(event,kind){event.preventDefault();var f=Object.fromEntries(new FormData(event.target).entries());var cid=db.companyId;try{
if(kind==='product'||kind==='editProduct'){var item=kind==='editProduct'?product(f.id):null;var dupe=rows('products').find(function(p){return p.sku===f.sku&&p.id!==(item&&item.id)});if(dupe)throw Error('Código de produto já existente nesta empresa');if(num(f.price)<0||num(f.cost)<0||num(f.min)<0||num(f.stock)<0)throw Error('Valores não podem ser negativos');if(!item){item={id:id(),cid:cid,stock:num(f.stock)};db.products.push(item)}Object.assign(item,{sku:f.sku.trim(),name:f.name.trim(),price:round(num(f.price)),cost:round(num(f.cost)),ncm:f.ncm||'',min:num(f.min)})}
if(kind==='partner'){db.partners.push({id:id(),cid:cid,kind:f.kind,name:f.name.trim(),document:f.document||''})}
if(kind==='purchase'){var pr=product(f.pid);if(!pr)throw Error('Produto não localizado nesta empresa');var qty=num(f.qty),cost=num(f.cost);if(qty<=0||cost<0)throw Error('Quantidade / custo inválido');pr.stock+=qty;pr.cost=round(cost);db.purchases.push({id:id(),cid:cid,date:day(),productId:pr.id,productName:pr.name,qty:qty,cost:cost,total:round(qty*cost)})}
if(kind==='finance'){var amount=num(f.amount);if(amount<=0)throw Error('Valor deve ser positivo');db.finance.push({id:id(),cid:cid,kind:f.kind,description:f.description.trim(),amount:round(amount),due:f.due,status:'Pendente'})}
if(kind==='draft'){var sale=rows('sales').find(function(s){return s.id===num(f.saleId)});if(!sale)throw Error('Selecione uma venda para pré-emissão');if(rows('drafts').some(function(d){return d.saleId===sale.id}))throw Error('Venda já possui pré-emissão');db.drafts.push({id:id(),cid:cid,model:f.model,saleId:sale.id,date:day()})}
if(kind==='company'){var nc=id();db.companies.push({id:nc,name:f.name.trim(),cnpj:f.cnpj||'',city:f.city||'',uf:f.uf||'PR'});db.companyId=nc}
save();closeModal();render();alertUser('Registro salvo na demonstração')}catch(e){alertUser(e.message)}}
function settle(fid){var f=rows('finance').find(function(x){return x.id===fid});if(f&&f.status==='Pendente'){f.status='Pago';save();render();alertUser('Baixa registrada')}}
function viewDraft(did){var d=rows('drafts').find(function(x){return x.id===did});if(!d)return;var s=rows('sales').find(function(x){return x.id===d.saleId});var c=db.companies.find(function(x){return x.id===db.companyId});modal('Pré-emissão '+(d.model==='55'?'NF-e':'NFC-e')+' #'+d.id,'<div class="banner">DOCUMENTO DEMONSTRATIVO • SEM VALOR FISCAL</div><p><b>'+clean(c.name)+'</b><br>'+clean(c.cnpj)+'</p><p>Venda #'+s.id+' — '+dateFmt(s.date)+'</p>'+table(['Produto','Qtd.','Valor'],s.items.map(function(i){return '<tr>'+td(clean(i.name))+td(i.qty)+td(fmt(i.qty*i.price))+'</tr>'}).join(''))+'<h2 style="text-align:right">Total '+fmt(s.total)+'</h2><div class="notice warn">Não é uma nota fiscal, DANFE ou documento de arrecadação. Não contém protocolo SEFAZ.</div>')}
function download(name,data,type){var a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type:type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1500)}
function backup(){download('GAV-Comercio-demo-backup.json',JSON.stringify(db,null,2),'application/json')}
function exportSales(){var txt='\ufeffNúmero;Data;Forma de pagamento;Total\n'+rows('sales').map(function(s){return [s.id,s.date,s.payment,s.total.toFixed(2).replace('.',',')].join(';')}).join('\n');download('gav-comercio-vendas-demo.csv',txt,'text/csv')}
function resetDemo(){if(confirm('Reiniciar todos os dados desta demonstração neste navegador?')){db=initial();cart=[];save();render();alertUser('Demonstração reiniciada')}}
render();
</script></body></html>
