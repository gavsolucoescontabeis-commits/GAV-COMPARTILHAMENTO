/* GAV Compartilhar Docs v0.2 — refinamento visual e histórico por ano */
:root{--gold:#d6ae52;--gold2:#f2d48f}
.category{background:linear-gradient(135deg,#252321,#17191b);border:1px solid #58472b;color:#f9f5ec;min-height:150px;box-shadow:0 8px 18px #16171918, inset 0 1px 0 #ffffff11}
.category:hover{background:linear-gradient(135deg,#373024,#1e2124);border-color:#d6ae52;box-shadow:0 10px 27px #17171430;transform:translateY(-2px)}
.cat-icon{background:linear-gradient(135deg,#e9c773,#ac7e30);color:#171717;width:45px;height:45px;box-shadow:0 5px 14px #0005}
.cat-name{font-size:14px;color:#fff}
.cat-count{color:#d0c6b3}
.cat-arrow{color:#dbb76b}
.logo-official{display:flex;align-items:center;min-height:47px}
.logo-official img{display:block;mix-blend-mode:normal;object-fit:contain;object-position:left center;max-width:100%;height:53px;max-height:64px}
.login-brand .logo-official img{height:77px}
.side .logo-official img{height:56px}
.logo-text{display:none;font-size:23px;letter-spacing:.12em;color:#edc770;font-weight:900}
.logo-text small{display:block;font-size:9px;letter-spacing:.12em;color:#e6dbbc}
.logo-fallback .logo-text{display:block}
.hero-official{width:142px;flex:0 0 142px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.hero-official img{max-width:142px;max-height:128px;object-fit:contain;mix-blend-mode:normal;opacity:.95}.gav-lion-login{position:absolute;right:16px;bottom:12px;opacity:.13;pointer-events:none}.gav-lion-login img{width:min(30vw,340px);aspect-ratio:1;object-fit:contain;mix-blend-mode:normal}@media(max-width:720px){.gav-lion-login{display:none}}
.year-guide{margin:19px 0 12px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid #e6dfcf;border-radius:14px;box-shadow:0 5px 14px #00000005}
.year-guide strong{display:block;font-size:17px;color:#252a2f;margin-top:4px}
.year-kicker{color:#a27a2d;font-size:10px;letter-spacing:.13em;font-weight:850}
.year-actions{display:flex;gap:8px;flex-wrap:wrap}
.historical-years{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 5px 14px}
.months{grid-template-columns:repeat(7,minmax(0,1fr))}
.month{min-height:42px}
.month.active{background:#2b2720;color:#f7d68d;border-color:#b18d4a}
@media(max-width:1100px){.months{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:720px){.hero-official{width:67px;flex-basis:67px}.hero-official img{max-width:67px;max-height:75px}.year-guide{padding:14px 13px}.cat-icon{width:39px;height:39px}.category{min-height:137px}.months{grid-template-columns:repeat(3,minmax(0,1fr))}.login-brand .logo-official img{height:65px}}
@media(max-width:360px){.category{min-height:88px}.cat-name{font-size:13px}}

/* v0.3 — controle interno de processamento de folhas, sem alterar o portal do cliente */
.pay-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:18px 0 21px}
.pay-kpi{background:white;border:1px solid var(--border);padding:19px;border-radius:14px;box-shadow:0 6px 18px #00000009}
.pay-kpi strong{font-size:29px;letter-spacing:-.055em;display:block;margin:6px 0;color:#2c3033}
.pay-kpi small{font-size:11px;color:#7c838c;font-weight:700}
.pay-kpi.c3{border-left:4px solid #3a9968}.pay-kpi.c2{border-left:4px solid #b38d38}.pay-kpi.c1{border-left:4px solid #bd7840}.pay-kpi.c0{border-left:4px solid #a9b0b9}
.pay-controls{display:flex;align-items:end;gap:12px;flex-wrap:wrap;padding:19px;margin-bottom:16px}
.pay-controls label{font-size:11px;font-weight:800;color:#727985;display:block;margin-bottom:7px}
.pay-controls .input{min-width:145px}
.pay-controls .pay-search{flex:1;min-width:160px}
.pay-chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 17px}
.pay-chip{border:1px solid #dddfe3;background:#fff;color:#656e77;border-radius:99px;font-size:11px;font-weight:800;padding:9px 13px}
.pay-chip.active{background:#242426;color:#ffe3ab;border-color:#242426}
.pay-row{background:#fff;border:1px solid #e3e6e9;border-radius:13px;margin:10px 0;overflow:hidden;box-shadow:0 4px 12px #10111208}
.pay-mainrow{width:100%;border:0;background:white;text-align:left;display:flex;align-items:center;gap:13px;padding:17px 18px;cursor:pointer}
.pay-mainrow:hover{background:#faf8f3}
.pay-company{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pay-company strong{font-size:13px;overflow-wrap:anywhere}
.pay-company small{color:#7a8189;font-size:11px}
.pay-progress{width:100px;height:7px;border-radius:99px;overflow:hidden;background:#ecedef;margin-left:auto;flex-shrink:0}
.pay-progress i{height:100%;display:block;background:#caa253;border-radius:99px}
.pay-status{font-size:10px;font-weight:850;padding:7px 10px;border-radius:99px;white-space:nowrap}

const scanBusy={active:false,cancel:false,detail:'',checked:0,accepted:0,source:''};
const scanNotice={kind:'',message:''};

const scanRoots=['TTM','REL GAV','DS CONTÁBIL','AVULSOS'];
const normGroup=v=>{const n=String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'');return n==='HELGAVE'?'RELGAV':n};
const groupOfCompany=c=>normGroup(c.group||(c.origin||'').match(/(?:^|[\\/])(TTM|REL GAV|DS CONT[AÁ]BIL)(?:[\\/]|$)/i)?.[1]||'');
const scanFolderKey=(group,folder)=>normGroup(group)+'|'+String(folder||'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
function scanLocation(path,preferred){
 // O navegador envia caminhos relativos à pasta selecionada. Aceitamos apenas
 // filhos DIRETOS da raiz do escritório, ou a pasta da própria empresa.
 const parts=String(path||'').replace(/\\/g,'/').split('/').filter(Boolean);
 const root=parts[0]||'', recognizedRoot=scanRoots.find(g=>normGroup(g)===normGroup(root));
 const group=recognizedRoot||preferred;
 const companyFolder=recognizedRoot?parts[1]||'':root;
 const info=structurePathInfo(path);
 const unknown={...info,companyFolder,group,companyId:null,folderKey:'',nameMismatch:false,ignored:true};
 if(!companyFolder||parts.length<(recognizedRoot?3:2)||normGroup(group)!==normGroup(preferred))return unknown;
 const pool=companies.filter(c=>groupOfCompany(c)===normGroup(group)&&!['exemplo','modelo'].includes(c.id));
 // TTM e outros escritórios numerados: a pasta deve ter o código do cadastro.
 // Pastas avulsas são reconhecidas exclusivamente pelo nome cadastrado.
 const prefix=companyFolder.match(/^\s*(\d{1,3})(?:\s|[_.,-]|$)/)?.[1]?.padStart(3,'0')||'';
 const exact=pool.filter(c=>normalizeFolder(c.folder||c.name)===normalizeFolder(companyFolder));
 const byCode=prefix?pool.filter(c=>(c.code||'')===prefix):[];
 const matched=group==='AVULSOS'?(exact.length===1?exact[0]:null):(prefix&&byCode.length===1?byCode[0]:null);
 if(!matched)return unknown;
 // Código igual e descrição diferente exige conferência; não publicamos sozinho.
 const nameMismatch=normalizeFolder(matched.folder||matched.name)!==normalizeFolder(companyFolder);
 return {...info,companyFolder,companyId:matched.id,group,folderKey:scanFolderKey(group,companyFolder),nameMismatch,ignored:false};
}
function scanFolders(){
 const map=new Map();
 for(const r of scanRows){
  if(!r.folderKey||!r.companyId||!companies.some(c=>c.id===r.companyId))continue;
  let x=map.get(r.folderKey);
  if(!x){x={key:r.folderKey,group:r.group,folder:r.companyFolder,count:0,review:0,companyId:r.companyId};map.set(r.folderKey,x)}
  x.count++;
  if(!r.valid||r.category==='unknown'||r.nameMismatch)x.review++;
 }
 return [...map.values()].sort((a,b)=>a.group.localeCompare(b.group,'pt-BR')||a.folder.localeCompare(b.folder,'pt-BR',{numeric:true}));
}
const SCANNER_MAX=6000;
const SCAN_LEGACY_LIMIT=3500;
const scanSmartSupported=()=>typeof window.showDirectoryPicker==='function';
function normalizeFolder(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/^\d+\s+/,'').replace(/[^A-Z0-9]/g,'');}
function folderMonthName(v){const p=String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();const n=['JANEIRO','FEVEREIRO','MARCO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];const mm=p.match(/^(0?[1-9]|1[0-3])(?:\s*(?:[-_./]|DE)\s*|\s+)?(20\d{2}|\d{2})$/);if(mm)return {month:months[Number(mm[1])-1],year:mm[2].length===2?2000+Number(mm[2]):Number(mm[2])};const yearFirst=p.match(/^(20\d{2})\s*[-_/ ]\s*(0?[1-9]|1[0-3])$/);if(yearFirst)return {month:months[Number(yearFirst[2])-1],year:Number(yearFirst[1])};const literal=p.match(/^(JANEIRO|FEVEREIRO|MARCO|ABRIL|MAIO|JUNHO|JULHO|AGOSTO|SETEMBRO|OUTUBRO|NOVEMBRO|DEZEMBRO|13(?:O|º)?(?:\s+SALARIO)?)(?:\s*[-_/ ]\s*(20\d{2}|\d{2}))?$/);if(literal)return {month:literal[1].startsWith('13')?'DÉCIMO TERCEIRO':months[n.indexOf(literal[1])],year:literal[2]?(literal[2].length===2?2000+Number(literal[2]):Number(literal[2])):null};return null;}
function structurePathInfo(path){
 const parts=String(path||'').replace(/\\/g,'/').split('/').filter(Boolean);let year=null,month=null,monthIndex=-1;
 for(let i=0;i<parts.length;i++){const t=parts[i].trim().toUpperCase(),x=t.match(/^X\s*(20\d{2})$/);if(x)year=Number(x[1]);const normal=t.match(/^(20\d{2})$/);if(normal)year=Number(normal[1]);const hit=folderMonthName(parts[i]);if(hit){month=hit.month;monthIndex=i;if(hit.year)year=hit.year}}
 const folder=monthIndex>=1?(parts[monthIndex-1].match(/^X\s*20\d{2}$/i)&&monthIndex>=2?parts[monthIndex-2]:parts[monthIndex-1]):'';
 const lower=parts.map(p=>p.toUpperCase());let companyFolder=folder;
 if(monthIndex>=2 && /^20\d{2}$/.test(parts[monthIndex-1]))companyFolder=parts[monthIndex-2];
 const idCompany=companies.find(c=>normalizeFolder(c.folder||c.name)===normalizeFolder(companyFolder))||null;
 const section=lower.includes('ADM')?'adm':lower.includes('RES')?'res':lower.includes('FER')?'fer':null;
 const file=parts.at(-1)||'', upper=file.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
 let category=section;
 if(!category){if(/DARF|INSS|FGTS|GUIA|TRIBUTO|IMPOSTO/.test(upper))category='guias';else if(/FOLHA|HOLERITE|RECIBO DE PAGAMENTO|RESUMO|RELATORIO/.test(upper))category='folha';else if(/CERTIDAO|CONTRATO SOCIAL/.test(upper))category='outros';else category='unknown'}
 let evidence=null;
 if(/DARF|INSS/.test(upper))evidence='darf';else if(/FGTS/.test(upper))evidence='fgts';else if(category==='folha'&&/FOLHA|RESUMO|RELATORIO/.test(upper))evidence='folha';
 return {parts,year,month,companyFolder,companyId:idCompany?.id||null,category,evidence,valid:!!(year&&month),file};
}
function scanEvidenceFor(id,competence){const [year,mon]=competence.split('-').map(Number);return scanRows.filter(r=>r.companyId===id&&r.year===year&&r.month===months[mon-1]&&r.evidence)}
function csvDownload(name,rows){const body='\uFEFF'+rows.map(row=>row.map(x=>{let v=String(x??'');if(/^[\s]*[=+@-]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}).join(';')).join('\r\n');const a=document.createElement('a');const blob=new Blob([body],{type:'text/csv;charset=utf-8'});a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}
function exportPayroll(){const rows=[['Competência','Grupo','Empresa','CNPJ','Situação','Etapas exigíveis','Etapas conferidas','Observação']];for(const c of payCompanies){const r=payRecord(c.id);rows.push([payUi.competence,c.group,c.name,companies.find(x=>x.id===c.id)?.cnpj||'',payName(payStatus(r)),r.required.map(t=>payTasks.find(x=>x.id===t)?.name||t).join(' | '),r.done.join(' | '),r.note||''])}csvDownload('GAV-Controle-Folha-'+payUi.competence+'.csv',rows);notify('Controle exportado em CSV.');}

function formatCnpj(value){const d=String(value||'').replace(/\D/g,'');return d.length===14?d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5'):String(value||'')}
function companyFolderName(group,code,name){return [group==='AVULSOS'?'':code,name].filter(Boolean).join(' ').trim()}
function addLocalCompany(){
 if(!isAdmin())return false;
 const name=document.getElementById('newCoName')?.value.trim().replace(/\s+/g,' ')||'';
 const digits=document.getElementById('newCoCnpj')?.value.replace(/\D/g,'')||'';
 const group=document.getElementById('newCoGroup')?.value||'';
 const rawCode=document.getElementById('newCoCode')?.value.trim()||'';
 const code=rawCode?rawCode.padStart(3,'0'):'';
 const folder=document.getElementById('newCoFolder')?.value.trim().replace(/\s+/g,' ')||'';
 const err=document.getElementById('newCoError');
 const fail=msg=>{if(err){err.textContent=msg;err.style.display='block'}else notify(msg);return false};
 if(!scanRoots.includes(group))return fail('Selecione um escritório válido.');
 if(name.length<3)return fail('Informe o nome da empresa.');
 if(!validCnpj(digits))return fail('CNPJ inválido. Confira os dígitos verificadores.');
 if(rawCode&&!/^\d{1,3}$/.test(rawCode))return fail('O código deve ter de 1 a 3 dígitos.');
 if(group!=='AVULSOS'&&!code)return fail('Informe o código. Para pastas sem código, selecione AVULSOS.');
 if(!folder||folder==='.'||folder==='..'||/[\\/]/.test(folder))return fail('Informe somente o nome da pasta, sem caminho completo.');
 if(companies.some(c=>c.cnpj.replace(/\D/g,'')===digits))return fail('CNPJ já cadastrado.');
 if(code&&companies.some(c=>c.code===code&&groupOfCompany(c)===normGroup(group)))return fail('Este código já existe neste escritório.');
 if(companies.some(c=>groupOfCompany(c)===normGroup(group)&&normalizeFolder(c.folder||c.name)===normalizeFolder(folder)))return fail('Esta pasta já está vinculada a outra empresa neste escritório.');
 const id='local-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
 const c={id,name,cnpj:formatCnpj(digits),group,code,folder,origin:group+' · '+folder+' (cadastro local)'};
 extraCompanies.push(c);companies.push(c);
 payCompanies.push({id,name,group,require:['folha','esocial','dctf','darf','fgts']});
 cfg[id]={enabled:false,categories:categories.map(x=>x.id)};
 safeSet(localStorage,CUSTOM_COMPANIES_KEY,JSON.stringify(extraCompanies));persist();
 state.selected=id;state.view='companies';payUi.group='all';scanView.group=group;render();
 notify('Empresa cadastrada para teste. Nenhum acesso foi liberado.');
 return true;

function scanUpdate(detail){
 scanBusy.detail=detail;
 const el=document.getElementById('scanLiveState');
 if(el)el.textContent=detail;
}
function scanEnd(){
 scanBusy.active=false;scanBusy.cancel=false;scanBusy.detail='';scanBusy.checked=0;scanBusy.accepted=0;scanBusy.source='';
 if(state.view==='scanner')renderContent();
}
function scanApply(found,preferred,replaceIds,stats){
 const targets=new Set(replaceIds);
 const existing=scanRows.filter(r=>r.group!==preferred||!targets.has(r.companyId));
 scanRows=existing.concat(found).map((r,i)=>({...r,id:i}));
 const available=new Set(scanRows.map(r=>r.folderKey));
 for(const key of scanSelected)if(!available.has(key))scanSelected.delete(key);
 scanStats[preferred]=stats;
 scanView.reviewCompany=null;scanView.query='';scanView.filter='all';
}
async function scanSmart(){
 if(!isAdmin()||scanBusy.active)return;
 const office=scanView.group;
 scanNotice.message='';
 if(!scanSmartSupported()){
   scanNotice.kind='warn';
   scanNotice.message='Este navegador não oferece a leitura seletiva. Abra o endereço pelo Chrome ou Edge atualizado; até lá, use somente a leitura de UMA empresa por vez abaixo. Não selecione a TTM inteira pelo seletor antigo.';
   renderContent();return;
 }
 let selected;
 try{
  // A chamada precisa acontecer diretamente no clique. A permissão é somente leitura.
  selected=await window.showDirectoryPicker({mode:'read',id:'gav-docs-'+office.toLowerCase().replace(/[^a-z]/g,'')});
 }catch(err){
  if(err?.name!=='AbortError'){
   scanNotice.kind='warn';scanNotice.message='Não foi possível abrir a pasta em modo seletivo: '+(err?.message||'permissão negada')+'. Você pode usar Chrome ou Edge atualizado.';
   renderContent();
  }
  return;
 }
 const rootIsOffice=normGroup(selected.name)===normGroup(office);
 const fakePath=office+'/'+selected.name+'/2026/JANEIRO/teste.pdf';
 const oneCompany=!rootIsOffice?scanLocation(fakePath,office):null;
 if(!rootIsOffice&&(!oneCompany?.companyId||oneCompany.ignored)){
   scanNotice.kind='warn';
   scanNotice.message='Pasta incorreta. Selecione '+office+' ou uma pasta de empresa cadastrada desse escritório. Nenhum arquivo foi lido.';
   renderContent();return;
 }
 const found=[],seenIds=new Set(),visitedCompanyIds=new Set();
 let rootSkipped=0,checked=0,unsupported=0,skippedDepth=0,truncated=false,rootFolders=0;
 scanBusy.active=true;scanBusy.cancel=false;scanBusy.checked=0;scanBusy.accepted=0;scanBusy.source=office;
 renderContent();
 const checkpoint=async detail=>{
   if(scanBusy.cancel)throw Error('scan-cancelled');
   if(checked%60===0){scanBusy.checked=checked;scanBusy.accepted=found.length;scanUpdate(detail);await new Promise(resolve=>setTimeout(resolve,0))}
 };
 const crawl=async(handle,base,depth)=>{
   if(depth>12){skippedDepth++;return}
   for await(const child of handle.values()){
     checked++;
     await checkpoint('Conferindo '+office+': '+checked+' entradas, '+found.length+' arquivos identificados. Somente nomes; nenhum arquivo baixado.');
     if(child.name.startsWith('.')){unsupported++;continue}
     if(child.kind==='directory'){
       await crawl(child,base.concat(child.name),depth+1);
       continue;
     }
     if(child.kind!=='file'||!/\.(pdf|docx?|xlsx?|csv|txt|png|jpe?g|xml)$/i.test(child.name)){unsupported++;continue}
     const path=base.concat(child.name).join('/');
     const hit=scanLocation(path,office);
     if(hit.ignored||!hit.companyId){unsupported++;continue}
     // Não chamamos child.getFile() nem lemos bytes, evitando downloads do Drive.
     found.push({...hit,path,size:null,modified:0});
     seenIds.add(hit.companyId);
     if(found.length>=SCAN_MAX_SAFE){truncated=true;throw Error('scan-limit')}
   }
 };
 const SCAN_MAX_SAFE=SCANNER_MAX;
 try{
   if(rootIsOffice){
     for await(const sub of selected.values()){
       if(scanBusy.cancel)throw Error('scan-cancelled');
       rootFolders++;
       if(sub.kind!=='directory'){rootSkipped++;continue}
       const hit=scanLocation(office+'/'+sub.name+'/2026/JANEIRO/teste.pdf',office);
       if(hit.ignored||!hit.companyId){rootSkipped++;continue}
       visitedCompanyIds.add(hit.companyId);
       scanUpdate('Empresa '+sub.name+': buscando somente os arquivos desta pasta cadastrada.');
       await crawl(sub,[office,sub.name],0);
       await new Promise(resolve=>setTimeout(resolve,0));
     }
   }else{
     visitedCompanyIds.add(oneCompany.companyId);
     await crawl(selected,[office,selected.name],0);
   }
 }catch(err){
   if(err?.message==='scan-cancelled'){
     scanNotice.kind='warn';scanNotice.message='Leitura cancelada. Nenhum arquivo novo foi aplicado. Os resultados anteriores foram preservados.';
     scanEnd();return;
   }
   if(err?.message!=='scan-limit'){
     scanNotice.kind='warn';
     scanNotice.message='Leitura interrompida pelo sistema de arquivos: '+(err?.message||'acesso indisponível')+'. Os resultados anteriores foram preservados.';
     scanEnd();return;
   }
 }
 // Não misturar registros antigos das mesmas empresas com uma leitura parcial.
 if(truncated){
   scanNotice.kind='warn';
   scanNotice.message='Limite seguro de '+SCANNER_MAX+' arquivos atingido. Resultado PARCIAL — não indica todos os documentos; faça leituras por empresa para complementar, ou aguarde a futura integração com a API do Google Drive.';
 }else if(!visitedCompanyIds.size){
   scanNotice.kind='warn';
   scanNotice.message='Nenhuma pasta corresponde a uma empresa cadastrada em '+office+'. Confira se selecionou o diretório correto.';
 }else{
   scanNotice.kind='ok';
   scanNotice.message='Leitura seletiva concluída: '+found.length+' arquivo(s) de '+visitedCompanyIds.size+' empresa(s). '+rootSkipped+' entradas da raiz foram ignoradas sem examinar seus arquivos. Nenhum PDF foi aberto ou enviado.';
 }
 if(found.length){
   // Só substituímos as empresas efetivamente lidas; as demais leituras ficam intactas.
   scanApply(found,office,visitedCompanyIds,{examined:checked,found:found.length,ignored:unsupported,skippedDirectories:rootSkipped,mode:'smart',partial:truncated});
 }else if(visitedCompanyIds.size&&!truncated){
   scanApply([],office,visitedCompanyIds,{examined:checked,found:0,ignored:unsupported,skippedDirectories:rootSkipped,mode:'smart',partial:false});
 }
 scanEnd();
}
async function scanFolder(files){
 if(!isAdmin()||scanBusy.active)return;
 const preferred=scanView.group;
 const total=files?.length||0;
 if(!total)return;
 if(total>SCAN_LEGACY_LIMIT){
   scanNotice.kind='warn';
   scanNotice.message='Leitura bloqueada com segurança: o seletor antigo recebeu '+total.toLocaleString('pt-BR')+' arquivos. NÃO escolha a pasta '+preferred+' inteira neste modo. Use o botão "Ler pasta principal (seletivo)" acima ou escolha uma só empresa. Nenhum arquivo foi enviado.';
   renderContent();return;
 }
 scanBusy.active=true;scanBusy.cancel=false;scanBusy.source=preferred;
 scanNotice.kind='';scanNotice.message='';
 renderContent();
 let examined=0,ignored=0,found=[];
 for(const f of files){
   if(scanBusy.cancel){scanNotice.kind='warn';scanNotice.message='Leitura interrompida; resultados anteriores preservados.';scanEnd();return}
   if(!f?.name||f.name.startsWith('.'))continue;
   examined++;
   if(!/\.(pdf|docx?|xlsx?|csv|txt|png|jpe?g|xml)$/i.test(f.name)){ignored++;continue}
   const path=f.webkitRelativePath||f.name;
   const result=scanLocation(path,preferred);
   if(result.ignored||!result.companyId){ignored++;continue}
   found.push({...result,path,size:f.size,modified:f.lastModified});
   if(examined%60===0){
     scanBusy.checked=examined;scanBusy.accepted=found.length;
     scanUpdate('Lendo '+examined+' nomes de '+total+' (somente a empresa escolhida).');
     await new Promise(resolve=>setTimeout(resolve,0));
   }
 }
 const firstPath=files[0]?.webkitRelativePath||'';
 const selectedIsOffice=normGroup(firstPath.split('/')[0])===normGroup(preferred);
 const targets=new Set(found.map(f=>f.companyId));
 if(!found.length){
   scanNotice.kind='warn';scanNotice.message='Nenhum arquivo correspondeu a uma empresa cadastrada de '+preferred+'. Os resultados anteriores foram preservados.';
 }else{
   if(selectedIsOffice){
     // Leitura de uma raiz pequena: atualizar só empresas efetivamente encontradas.
     scanApply(found,preferred,targets,{examined,found:found.length,ignored,mode:'legacy',partial:false});
   }else{
     scanApply(found,preferred,targets,{examined,found:found.length,ignored,mode:'legacy',partial:false});
   }
   scanNotice.kind='ok';scanNotice.message=found.length+' arquivo(s) identificado(s) nesta empresa; '+ignored+' ignorado(s). Os resultados de outras empresas foram preservados.';
 }
 scanEnd();
}

async function openProtectedTtmRegistry(passphrase){
 if(!passphrase)throw Error('invalid-key');if(!window.crypto?.subtle)throw Error('crypto-unavailable');
 let response;try{response=await fetch('./ttm-registry.enc.json',{cache:'no-store'})}catch{throw Error('no-registry')}
 if(!response.ok)throw Error('no-registry');
 const pack=await response.json();
 if(pack.version!==1||pack.alg!=='AES-256-GCM'||pack.kdf!=='PBKDF2-SHA256')throw Error('no-registry');
 const bytes=str=>Uint8Array.from(atob(str),ch=>ch.charCodeAt(0));
 try{
   const master=await window.crypto.subtle.importKey('raw',new TextEncoder().encode(passphrase),{name:'PBKDF2'},false,['deriveKey']);
   const key=await window.crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(pack.salt),iterations:pack.iterations,hash:'SHA-256'},master,{name:'AES-GCM',length:256},false,['decrypt']);
   const result=await window.crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(pack.iv),additionalData:new TextEncoder().encode('GAV-TTM-v1'),tagLength:128},key,bytes(pack.data));
   const rows=JSON.parse(new TextDecoder().decode(result));
   if(!Array.isArray(rows)||rows.length!==18||rows.some(x=>x.group!=='TTM'||!/^\d{3}$/.test(x.code)||!validCnpj(x.cnpj)))throw Error('invalid-key');
   return rows;
 }catch{throw Error('invalid-key')}
}
function applyProtectedTtmRegistry(rows){
 for(const x of rows){
   const code=x.code,id='ttm-'+code;
   const rec={id,code,name:x.name,cnpj:x.cnpj,group:'TTM',folder:code+' '+x.name,origin:'TTM · pré-cadastro já incluído; aguardando leitura da pasta'};
   const idx=extraCompanies.findIndex(c=>c.id===id||(c.group==='TTM'&&c.code===code));
   if(idx<0)extraCompanies.push(rec);else extraCompanies[idx]=rec;
   const cidx=companies.findIndex(c=>c.id===id);
   if(cidx<0)companies.push(rec);else companies[cidx]=rec;
   const pidx=payCompanies.findIndex(c=>c.id===id);
   if(pidx<0)payCompanies.push({id,name:rec.name,group:'TTM',require:['folha','esocial','dctf','darf','fgts']});
   else{payCompanies[pidx].name=rec.name;payCompanies[pidx].group='TTM'}
   cfg[id]={enabled:false,categories:categories.map(c=>c.id)};
 }
}
function onlyTtm(){return extraCompanies.filter(c=>c.group==='TTM'&&/^\d{3}$/.test(c.code||'')).sort((a,b)=>a.code.localeCompare(b.code,'pt-BR',{numeric:true}))}
function validCnpj(v){
 const n=String(v||'').replace(/\D/g,'');if(n.length!==14||/^(\d)\1+$/.test(n))return false;
 for(const k of [12,13]){const w=k===12?[5,4,3,2,9,8,7,6,5,4,3,2]:[6,5,4,3,2,9,8,7,6,5,4,3,2];const d=11-(w.reduce((sum,weight,i)=>sum+Number(n[i])*weight,0)%11);if(Number(n[k])!==(d>=10?0:d))return false;}
 return true;
}
function importTTM(){
 if(!isAdmin())return;
 const raw=document.getElementById('ttmBulkText')?.value||'';
 const rows=raw.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);
 let imported=0,updated=0;const problems=[];
 const seen=new Set();
 for(const [i,line] of rows.entries()){
   if(/^COD\s*[\t;]/i.test(line)||/^C[ÓO]DIGO\s*[\t;]/i.test(line))continue;
   let fields=line.split('\t').map(v=>v.trim());
   if(fields.length<3)fields=line.split(';').map(v=>v.trim());
   if(fields.length!==3){problems.push('Linha '+(i+1)+': use CÓDIGO;EMPRESA;CNPJ ou colunas copiadas da planilha.');continue}
   const [rawCode,name,cnpjRaw]=fields,code=String(rawCode||'').trim().padStart(3,'0');
   const digits=String(cnpjRaw||'').replace(/\D/g,'');
   if(!/^\d{3}$/.test(code)||!name||!validCnpj(digits)){problems.push('Linha '+(i+1)+': código, empresa ou CNPJ inválido.');continue}
   if(seen.has(code)){problems.push('Linha '+(i+1)+': código '+code+' repetido.');continue}seen.add(code);
   const duplicate=extraCompanies.find(x=>x.cnpj?.replace(/\D/g,'')===digits&&!(x.group==='TTM'&&x.code===code));
   if(duplicate||companies.some(x=>!extraCompanies.some(y=>y.id===x.id)&&x.cnpj?.replace(/\D/g,'')===digits)){
     problems.push('Linha '+(i+1)+': CNPJ já vinculado a outro cadastro.');continue;
   }
   const cnpj=digits.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5');
   const entry={id:'ttm-'+code,code,name:name.slice(0,180),cnpj,folder:code+' '+name.slice(0,180),origin:'TTM · pré-cadastro; pasta ainda não conferida',group:'TTM'};
   const byId=extraCompanies.findIndex(x=>x.group==='TTM'&&x.code===code);
   const old=byId>=0?extraCompanies[byId]:null;
   if(old){entry.id=old.id;extraCompanies[byId]=entry;updated++;}
   else{extraCompanies.push(entry);imported++;}
   const pos=companies.findIndex(x=>x.id===entry.id);
   if(pos>=0)companies[pos]=entry;else companies.push(entry);
   const pr=payCompanies.find(x=>x.id===entry.id);
   if(pr){pr.name=entry.name;pr.group='TTM'}else payCompanies.push({id:entry.id,name:entry.name,group:'TTM',require:['folha','esocial','dctf','darf','fgts']});
   if(!cfg[entry.id])cfg[entry.id]={enabled:false,categories:categories.map(x=>x.id)};
 }
 if(imported||updated){safeSet(localStorage,CUSTOM_COMPANIES_KEY,JSON.stringify(extraCompanies));persist();}
 scanView.preSearch='';
 renderContent();
 notify('TTM: '+imported+' importada(s), '+updated+' atualizada(s)'+(problems.length?' · '+problems.length+' pendência(s).':''));
 if(problems.length){const notice=document.getElementById('ttmImportIssues');if(notice){notice.textContent=problems.slice(0,12).join(' | ');notice.style.display='block'}}
}
function exportTtmRegister(){
 const rows=[['CÓDIGO','EMPRESA','CNPJ','ORIGEM','PASTA ENCONTRADA','SITUAÇÃO']];
 const folders=scanFolders();
 for(const c of onlyTtm()){const hits=folders.filter(f=>f.companyId===c.id);rows.push([c.code,c.name,c.cnpj,'TTM',hits.map(f=>f.folder).join(' | '),hits.length?'Encontrada — conferir':'Aguardando leitura']);}
 if(rows.length===1){notify('Nenhuma empresa TTM importada.');return}
 csvDownload('GAV-Pré-Cadastro-TTM-LOCAL.csv',rows);notify('Pré-cadastro TTM exportado.');
}

m <strong>${payExecution(period)}</strong></div><div class="pay-summary"><div class="pay-kpi c0"><small>PENDENTES</small><strong>${counts.pending}</strong></div><div class="pay-kpi c1"><small>EM ANDAMENTO</small><strong>${counts.progress}</strong></div><div class="pay-kpi c2"><small>PRONTAS PARA CONFERIR</small><strong>${counts.ready}</strong></div><div class="pay-kpi c3"><small>CONCLUÍDAS</small><strong>${counts.done}</strong></div></div><div class="pay-chips">${[['all','Todas'],['pending','Pendentes'],['progress','Em andamento'],['ready','Prontas para conferir'],['done','Concluídas']].map(([k,label])=>`<button class="pay-chip ${payUi.filter===k?'active':''}" data-action="pay-filter" data-val="${k}">${label}</button>`).join('')}</div><div class="section-title">Empresas <span class="subtle">${visible.length} exibidas de ${payCompanies.length}</span></div>${visible.length?visible.map(c=>{const r=payRecord(c.id),status=payStatus(r),n=r.required.filter(t=>r.done.includes(t)).length,tot=r.required.length,isOpen=payUi.open===c.id;return `<div class="pay-row"><button class="pay-mainrow" data-action="pay-open" data-val="${c.id}" aria-expanded="${isOpen}"><span class="company-badge">${icon('building',17)}</span><span class="pay-company"><strong>${esc(c.name)}</strong><small>${c.group} · ${n}/${tot} etapas aplicáveis concluídas</small></span><span class="pay-progress" aria-label="${n} de ${tot} etapas"><i style="width:${tot?Math.round(n/tot*100):0}%"></i></span><span class="pay-status ${status}">${payName(status)}</span>${icon('chevron',16)}</button>${isOpen?payrollDetails(c,r):''}</div>`}).join(''):`<div class="card empty"><strong>Nenhuma empresa nesta seleção.</strong>Escolha outro filtro.</div>`}<div class="notice" style="margin-top:18px">Regras: DARF e FGTS podem ser marcados como <b>não aplicáveis</b> por empresa e competência. A existência dos arquivos ajuda no controle, mas a situação <b>Concluída</b> exige confirmação administrativa. Nenhuma destas informações aparece no portal do cliente.</div>${footer()}`;}
function payrollDetails(c,r){const status=payStatus(r);return `<div class="pay-detail"><div class="subtle">Checklist de <b>${esc(c.name)}</b> · ${esc(payUi.competence)}. Marque cada etapa depois da conferência. A identificação de arquivos não substitui a conferência do fechamento.</div>${(()=>{const ev=scanEvidenceFor(c.id,payUi.competence);return ev.length?`<div class="pay-evidence"><strong>${ev.length} possível(is) documento(s) encontrado(s) nesta leitura local:</strong><ul>${ev.slice(0,6).map(x=>`<li>${esc(x.file)} — ${esc(payTasks.find(t=>t.id===x.evidence)?.name||'Documento')}</li>`).join('')}</ul><span class="pay-small">Apenas sugestão. Confira a documentação antes de marcar as etapas.</span></div>`:''})()}<div class="pay-steps">${payTasks.filter(t=>r.required.includes(t.id)).map(t=>{const done=r.done.includes(t.id);return `<button class="pay-step ${done?'on':'off'}" data-action="pay-step" data-val="${c.id}" data-extra="${t.id}"><i>${done?icon('check',17):icon('plus',17)}</i><span>${esc(t.name)}<span class="pay-small">${done?esc(r.source?.[t.id]||'Conferência manual'):esc(t.help)}</span></span></button>`}).join('')}</div><div class="pay-settings"><span class="pay-note" style="width:100%;margin:9px 0 2px"><b>Exigibilidade dos documentos (por competência):</b></span>${[['darf','DARF INSS exigível'],['fgts','FGTS exigível']].map(([id,label])=>`<button class="pay-setting ${r.required.includes(id)?'on':''}" data-action="pay-require" data-val="${c.id}" data-extra="${id}">${r.required.includes(id)?'✓':'—'} ${label}</button>`).join('')}</div><div class="pay-actions"><button class="btn ${status==='ready'?'btn-dark':'btn-line'} btn-small" data-action="pay-approve" data-val="${c.id}" ${status!=='ready'?'disabled':''}>${icon('check',14)} Confirmar fechamento</button>${status==='done'?`<button class="btn btn-line btn-small" data-action="pay-reopen" data-val="${c.id}">Reabrir controle</button>`:''}<button class="btn btn-soft btn-small" data-action="pay-mock" data-val="${c.id}">${icon('sync',14)} Simular chegada de relatório</button></div><div class="pay-note-edit"><label for="payNoteEdit" class="subtle" style="font-weight:800">OBSERVAÇÃO DA COMPETÊNCIA</label><textarea id="payNoteEdit" maxlength="1000" placeholder="Pendência, informação interna ou motivo de documento não aplicável">${esc(r.note||'')}</textarea><button class="btn btn-line btn-small" data-action="pay-note-save" data-val="${c.id}" style="margin-top:6px">Salvar observação</button></div>${status==='done'?'<p class="pay-note" style="color:#18774a;margin-top:12px">Fechamento confirmado neste protótipo.</p>':'<p class="pay-note" style="margin-top:12px">A confirmação só é liberada quando todas as etapas exigíveis estão conferidas.</p>'}</div>`}
function payrollAction(action,id,extra){if(!isAdmin())return;const r=payRecord(id);if(action==='pay-step'){if(r.done.includes(extra))r.done=r.done.filter(t=>t!==extra);else{r.done.push(extra);r.source[extra]='Conferência manual'}r.approved=false}
 if(action==='pay-require'){if(r.required.includes(extra)){r.required=r.required.filter(t=>t!==extra);r.done=r.done.filter(t=>t!==extra);delete r.source[extra]}else r.required.push(extra);r.approved=false}
 if(action==='pay-approve'){if(payStatus(r)==='ready')r.approved=true;else{notify('Ainda há etapas exigíveis pendentes.');return}}
 if(action==='pay-reopen')r.approved=false;
 if(action==='pay-mock'){if(r.required.includes('folha')){if(!r.done.includes('folha'))r.done.push('folha');r.source.folha='Documento detectado (simulação)';r.approved=false;notify('Simulação: relatório mensal identificado na pasta da competência.')}else notify('Relatório não exigido neste cadastro.');}
 payStore();renderContent()}

const classify=d=>{const raw=(d.path||'').replace(/\\/g,'/'),parts=raw.toUpperCase().split('/');if(parts.includes('ADM'))return 'adm';if(parts.includes('RES'))return 'res';if(parts.includes('FER'))return 'fer';if(parts.includes('DESCONHECIDO'))return 'unknown';const n=d.title.toUpperCase();if(/GUIA|FGTS|DARF|INSS|TRIBUTO|IMPOSTO/.test(n))return 'guias';if(/CERTID[AÃ]O|CONTRATO SOCIAL|CNPJ/.test(n))return 'outros';return 'folha'};

const el=()=>document.getElementById('app');const dispatch=(a,...args)=>{switch(a){case'login':login();break;case'logout':sess=null;safeRemove(localStorage,LOGIN_KEY);safeRemove(sessionStorage,LOGIN_KEY);render();break;case'view':state.view=args[0];state.search='';state.month='ALL';render();break;case'category':state.category=args[0];state.view='category';state.month='ALL';state.search='';render();break;case'year':state.year=Number(args[0]);state.showArchive=state.year!==activeYear();state.month='ALL';render();break;case'archive':state.showArchive=!state.showArchive;renderContent();break;case'month':state.month=args[0];render();break;case'search':state.search=args[0];renderContent();break;case'preview':state.preview=Number(args[0]);render();break;case'close':state.preview=null;render();break;case'company':state.selected=args[0];state.view='home';state.category=null;state.year=activeYear();state.showArchive=false;render();break;case'allow-company':cfg[args[0]].enabled=args[1]==='true';persist();render();break;case'allow-cat':{let a=cfg[args[0]].categories;const idx=a.indexOf(args[1]);if(idx<0)a.push(args[1]);else a.splice(idx,1);persist();render();break;}case'admin-tab':state.adminTab=args[0];render();break;case'sync':simulateSync();break;case'add':addDoc();break;case'reset':if(confirm('Reiniciar todos os dados fictícios de demonstração?')){docs=structuredClone(seed);cfg=structuredClone(defaultConfig);payroll=payrollSample();persist();payStore();state.view='home';notify('Demonstração reiniciada');render()}break;case'scan-jump':if(isAdmin()){scanView.group=args[0];scanView.reviewCompany=null;state.view='scanner';render()}break;case'scan-group':if(isAdmin()){scanView.group=args[0];scanView.reviewCompany=null;renderContent()}break;case'scan-filter':if(isAdmin()){scanView.filter=args[0];renderContent()}break;case'scan-review':if(isAdmin()&&companies.some(c=>c.id===args[0])){scanView.reviewCompany=scanView.reviewCompany===args[0]?null:args[0];state.view='scanner';renderContent();document.getElementById('scanReviewDetails')?.scrollIntoView?.({block:'start',behavior:'smooth'})}break;case'scan-smart':if(isAdmin())scanSmart();break;case'scan-cancel':if(isAdmin()&&scanBusy.active){scanBusy.cancel=true;scanUpdate('Cancelando a leitura...')}break;case'scan-export':if(isAdmin())exportScan();break;case'scan-selection-export':if(isAdmin())scanSelectionCsv();break;case'ttm-import':if(isAdmin())importTTM();break;case'ttm-export':if(isAdmin())exportTtmRegister();break;case'pay-export':if(isAdmin())exportPayroll();break;case'company-add':addLocalCompany();break;case'pay-note-save':savePayrollNote(args[0]);break;case'pay-filter':if(isAdmin()){payUi.filter=args[0];payUi.open=null;renderContent()}break;case'pay-open':if(isAdmin()){payUi.open=payUi.open===args[0]?null:args[0];renderContent()}break;case'pay-step':case'pay-require':case'pay-approve':case'pay-reopen':case'pay-mock':payrollAction(a,args[0],args[1]);break;case'download':downloadPdf(Number(args[0]));break;case'copy':copyDemoLink();break;case'client-view':state.view='home';render();break;}}
function notify(msg){state.toast=msg;let old=document.querySelector('.toast');old?.remove();const n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.append(n);setTimeout(()=>n.remove(),3500)}
async function login(){
 const raw=document.getElementById('loginId').value.trim(),pwd=document.getElementById('loginPwd').value.trim(),id=raw.replace(/\D/g,'');
 const err=document.getElementById('loginError');err?.classList.add('hide');let next=null;
 if(raw.toLowerCase()==='admin@gav.local'){
   try{
     const registry=await openProtectedTtmRegistry(pwd);
     applyProtectedTtmRegistry(registry);
     next={role:'admin'};
   }catch(error){
     if(err){err.textContent=error?.message==='invalid-key'?'Chave administrativa não corresponde ao cadastro protegido. Confira a chave desta conversa.':error?.message==='crypto-unavailable'?'Este navegador não conseguiu acessar a criptografia segura. Abra o portal por HTTPS em navegador atualizado.':'Não foi possível carregar o pré-cadastro protegido. Confira a conexão e tente novamente.';err.classList.remove('hide')}
     return;
   }
 }else{
   const c=companies.find(x=>['exemplo','modelo'].includes(x.id)&&x.cnpj.replace(/\D/g,'')===id);
   if(c&&pwd==='teste123'&&cfg[c.id]?.enabled)next={role:'client',c:c.id};
 }
 if(!next){if(err){err.textContent='CNPJ/usuário ou senha incorretos para esta demonstração.';err.classList.remove('hide')}return}
 sess=next;state.selected=next.c||'ttm-000';state.view=next.role==='admin'?'scanner':'home';
 scanView.group='TTM';
 if(next.role==='admin'){
   // A chave não fica salva no navegador: cada novo acesso administrativo solicita autenticação.
   safeRemove(localStorage,LOGIN_KEY);safeRemove(sessionStorage,LOGIN_KEY);
 }else{
   const remember=document.getElementById('remember').checked;
   if(remember){safeSet(localStorage,LOGIN_KEY,JSON.stringify(sess));safeRemove(sessionStorage,LOGIN_KEY)}
   else{safeSet(sessionStorage,LOGIN_KEY,JSON.stringify(sess));safeRemove(localStorage,LOGIN_KEY)}
 }
 render();
}

function catHtml(){const c=getCategory(state.category);if(!c)return homeHtml();const all=catDocs(c.id),years=[...new Set(all.map(docYear))].sort((a,b)=>b-a);const inYear=all.filter(d=>docYear(d)===state.year);if(state.month!=='ALL'&&!inYear.some(d=>docMonth(d)===state.month))state.month='ALL';const chosen=inYear.filter(d=>(state.month==='ALL'||docMonth(d)===state.month)&&(!state.search||`${d.title} ${d.employee} ${d.month}`.toLowerCase().includes(state.search.toLowerCase())));const isPeople=['adm','res','fer'].includes(c.id);const people=[...new Set(chosen.map(d=>d.employee||'Documentos sem funcionário identificado'))];return `<div class="crumb"><button data-action="view" data-val="home">Início</button>${icon('chevron',12)}${esc(c.label)}</div>${titleHead(c.label,c.sub)}${yearPicker(all)}<div class="months"><button class="month ${state.month==='ALL'?'active':''}" data-action="month" data-val="ALL">TODOS</button>${months.map(m=>`<button class="month ${state.month===m?'active':''}" data-action="month" data-val="${m}" ${inYear.some(d=>docMonth(d)===m)?'':'disabled'}>${m==='DÉCIMO TERCEIRO'?'13º':m.slice(0,3)}</button>`).join('')}</div><div class="section-title">${state.month==='ALL'?'Todos os meses':state.month} / ${state.year} <span class="tag dim">${chosen.length} arquivo(s)</span></div><div class="toolbar"><input class="input" id="docSearch" placeholder="Pesquisar por arquivo ou funcionário..." value="${esc(state.search)}" aria-label="Pesquisar documentos" /><button class="btn btn-line btn-small" id="searchBtn">${icon('search',15)} Pesquisar</button></div><div class="card card-pad" id="docResults">${isPeople&&chosen.length?people.map(p=>`<details class="employee-group" open><summary>${esc(p)} <span class="subtle">${chosen.filter(d=>(d.employee||'Documentos sem funcionário identificado')===p).length} arquivo(s)</span></summary><div class="file-list">${fileList(chosen.filter(d=>(d.employee||'Documentos sem funcionário identificado')===p))}</div></details>`).join(''):fileList(chosen)}</div>${footer()}`}
function recentHtml(){const all=selectedDocs().filter(d=>classify(d)!=='unknown').sort((a,b)=>b.id-a.id),chosen=all.filter(d=>`${d.title} ${d.employee} ${docMonth(d)} ${docYear(d)}`.toLowerCase().includes(state.search.toLowerCase()));return `${titleHead('Documentos recentes','Consulte os arquivos mais recentes desta empresa.')}<div class="toolbar"><input id="recentSearch" class="input" aria-label="Pesquisar documentos recentes" placeholder="Pesquisar documento ou funcionário..." value="${esc(state.search)}"><button class="btn btn-line btn-small" id="searchBtn">${icon('search',15)} Pesquisar</button></div><div class="card card-pad">${fileList(chosen)}</div>${footer()}`}
function newCompanyHtml(){return `${titleHead('Cadastrar nova empresa','Cadastre somente a empresa nova; as 18 empresas da TTM permanecem preservadas.')}<div class="admin-actions"><button class="btn btn-line" data-action="view" data-val="companies">${icon('back',15)} Voltar às empresas</button></div><div class="notice" style="margin-bottom:15px">Cadastro administrativo de teste: os dados permanecem neste navegador, sem criar acesso de cliente.</div><div class="company-add"><h3 style="margin:0">Cadastrar nova empresa</h3><p class="subtle">Informe escritório, código, CNPJ e pasta. O cadastro permanece neste navegador, sem criar login de cliente.</p><form id="companyAddForm"><div class="company-add-grid"><div><label for="newCoName">Razão social / nome *</label><input id="newCoName" class="input" required placeholder="Empresa de teste"></div><div><label for="newCoCnpj">CNPJ *</label><input id="newCoCnpj" class="input" required maxlength="18" placeholder="00.000.000/0001-00" inputmode="numeric"></div><div><label for="newCoCode">Código (quando houver)</label><input id="newCoCode" class="input" maxlength="3" inputmode="numeric" placeholder="Ex.: 077"></div><div><label for="newCoFolder">Nome exato da pasta da empresa</label><input id="newCoFolder" class="input" required placeholder="Nome da pasta, sugerido automaticamente"></div><div><label for="newCoGroup">Escritório / origem *</label><select id="newCoGroup" class="input"><option value="TTM">TTM</option><option value="REL GAV">REL GAV</option><option value="DS CONTÁBIL">DS CONTÁBIL</option><option value="AVULSOS">AVULSOS</option></select></div></div><div id="newCoError" class="notice" style="display:none;color:#9d3428;border-color:#c89c95;margin:12px 0"></div><button class="btn btn-dark" type="submit">${icon('plus',16)} Salvar nova empresa</button></form></div>${footer()}`;}
function companiesHtml(){return `${titleHead('Empresas e permissões','Gerencie as empresas e confira como cada CNPJ será atendido.')}<div class="admin-actions"><button class="btn btn-dark" data-action="view" data-val="new-company">${icon('plus',16)} Cadastrar nova empresa</button><button class="btn btn-line" data-action="view" data-val="scanner">${icon('folder',15)} Conferir pastas</button></div><div class="notice" style="margin-bottom:18px"><strong>Atenção:</strong> alterações neste painel mudam apenas os dados fictícios da demonstração. O vínculo real com o Google Drive será implementado depois.</div><div class="split"><div class="card card-pad"><h3 class="block-title">Empresas cadastradas</h3>${companies.map(c=>`<div class="company-row"><div class="company-badge">${icon('building')}</div><div class="company-info"><strong>${esc(c.name)}</strong><span>${esc(c.cnpj)} · ${esc(c.origin)}</span></div><label class="switch"><input data-company-toggle="${c.id}" type="checkbox" ${cfg[c.id]?.enabled?'checked':''}><span>${cfg[c.id]?.enabled?'Ativo':'Inativo'}</span></label></div>`).join('')}<div class="admin-actions" style="margin-top:19px"><button class="btn btn-line" data-action="copy">${icon('folder',15)} Copiar link do portal</button><button class="btn btn-line" data-action="reset">${icon('sync',15)} Restaurar exemplo</button></div></div><div class="card card-pad"><h3 class="block-title">Categorias liberadas</h3><div class="subtle" style="margin-bottom:14px">Selecione a empresa para configurar o que aparece no acesso dela.</div><select id="permissionCompany" class="input">${companies.map(c=>`<option value="${c.id}" ${state.selected===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><div style="margin-top:12px">${categories.map(c=>`<label class="company-row" style="cursor:pointer"><div style="color:#a4864f">${icon(c.icon)}</div><div class="company-info"><strong>${esc(c.label)}</strong></div><input type="checkbox" data-category-toggle="${c.id}" ${cfg[state.selected].categories.includes(c.id)?'checked':''}></label>`).join('')}</div><button class="btn btn-dark" style="width:100%;margin-top:20px" data-action="view" data-val="home">${icon('eye',15)} Conferir visualização do cliente</button></div></div>${footer()}`}
function rulesHtml(){const unknown=selectedDocs().filter(d=>classify(d)==='unknown');return `${titleHead('Organização automática','A estrutura no aplicativo é diferente das pastas de origem.')}<div class="split"><div class="card card-pad"><h3 class="block-title">Mapeamento de pastas</h3><div class="notice" style="margin-bottom:14px">Compatível com o BAT já utilizado: pastas <b>012026</b> ou <b>0126</b>; meses arquivados em <b>X2025</b>, <b>X2024</b> etc., incluindo a pasta <b>13</b> do décimo terceiro. Sem mover ou renomear arquivos.</div>${[['ADM','Admissões'],['RES','Rescisões'],['FER','Férias'],['Arquivo mensal de folha','Folha de Pagamento'],['Nomes contendo GUIA, FGTS, DARF, INSS','Guias e Impostos'],['Nomes contendo CERTIDÃO','Outros Documentos']].map(([from,to])=>`<div class="rule"><span><code>${esc(from)}</code></span><strong>${esc(to)}</strong></div>`).join('')}<div class="notice" style="margin-top:17px">As regras acima são demonstrativas. Na versão real, os arquivos não identificados ficarão pendentes de conferência, sem liberação automática.</div></div><div class="card card-pad"><h3 class="block-title">Simulação de sincronização</h3><p class="subtle">Adicione um documento fictício como se tivesse sido salvo dentro da pasta do Drive. Ele aparecerá na categoria correta.</p><form id="addForm"><div class="form-field"><label for="addCategory">Pasta de origem</label><select id="addCategory" class="input"><option value="ADM">ADM — Admissões</option><option value="RES">RES — Rescisões</option><option value="FER">FER — Férias</option><option value="FOLHA">Relatório mensal</option><option value="GUIA">Guia / Imposto</option></select></div><div class="form-field"><label for="addMonth">Mês</label><select id="addMonth" class="input">${months.map(m=>`<option value="${m}">${m}</option>`).join('')}</select></div><div class="form-field"><label for="addName">Nome do documento</label><input required id="addName" class="input" maxlength="100" placeholder="Ex.: Admissão - Maria Simulação.pdf"></div><div class="form-field"><label for="addEmployee">Funcionário (opcional)</label><input id="addEmployee" class="input" maxlength="80" placeholder="Ex.: Maria Simulação"></div><button class="btn btn-dark" type="submit" style="width:100%;margin-top:20px">${icon('plus',15)} Adicionar documento fictício</button></form><h3 class="block-title" style="margin-top:26px">Pendências de classificação: ${unknown.length}</h3>${unknown.length?fileList(unknown):'<p class="subtle">Nenhuma pendência nesta empresa.</p>'}</div></div>${footer()}`}
function previewHtml(){const d=docs.find(d=>d.id===state.preview);if(!d)return '';return `<div class="overlay" id="previewOverlay"><div class="modal" role="dialog" aria-modal="true" aria-label="Prévia do documento"><div class="modal-head"><div><div class="eyebrow">VISUALIZAR DOCUMENTO</div><div style="font-weight:850;font-size:15px;margin-top:7px;overflow-wrap:anywhere">${esc(d.title)}</div></div><button class="btn btn-line btn-small" data-action="close" title="Fechar">${icon('close',16)}</button></div><div class="modal-body"><div class="preview-paper"><div style="font-size:20px;font-weight:900;letter-spacing:.18em;color:#a58643">GAV</div><div style="font-size:8px;letter-spacing:.19em;color:#777">SOLUÇÕES CONTÁBEIS</div><hr style="border:0;border-top:2px solid #bd995a;margin:15px 0"><h3>${esc(d.title.replace(/\.pdf$/i,''))}</h3><p><b>Empresa:</b> ${esc(companies.find(c=>c.id===d.c)?.name)}<br><b>Competência:</b> ${esc(docMonth(d))}/${docYear(d)}<br><b>Categoria:</b> ${esc(getCategory(classify(d))?.label||'Documento pendente')}<br>${d.employee?`<b>Funcionário:</b> ${esc(d.employee)}<br>`:''}</p><p style="margin-top:27px;color:#a07d41;font-weight:800">DOCUMENTO FICTÍCIO PARA TESTE</p><p>Este conteúdo é apenas uma amostra visual. O portal real apresentará o PDF original armazenado no Google Drive, após autenticação e autorização.</p></div><div class="subtle" style="margin-top:13px;font-size:11px">Origem simulada: ${esc(d.path)}</div></div><div class="modal-buttons"><button class="btn btn-line" data-action="close">Fechar</button><button class="btn btn-dark" data-action="download" data-val="${d.id}">${icon('download',16)} Baixar PDF de exemplo</button></div></div></div>`}
function render(){if(!sess){el().innerHTML=loginHtml();document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();login()});return}el().innerHTML=shellHtml();renderContent();if(state.preview!==null){el().insertAdjacentHTML('beforeend',previewHtml())}document.querySelectorAll('.side [data-action], .topbar [data-action], .bottom-bar [data-action], .overlay [data-action]').forEach(b=>b.addEventListener('click',onClick));bindDynamic()}
function renderContent(){if(!sess)return;const v=state.view,html=v==='home'?homeHtml():v==='category'?catHtml():v==='recent'?recentHtml():v==='payroll'&&isAdmin()?payrollHtml():v==='companies'&&isAdmin()?companiesHtml():v==='new-company'&&isAdmin()?newCompanyHtml():v==='rules'&&isAdmin()?rulesHtml():v==='scanner'&&isAdmin()?scannerHtml():homeHtml();document.getElementById('mainContent').innerHTML=html;document.querySelectorAll('#mainContent [data-action]').forEach(b=>b.addEventListener('click',onClick));bindContent()}
function onClick(e){const b=e.currentTarget;dispatch(b.dataset.action,b.dataset.val,b.dataset.extra)}
function bindDynamic(){const p=document.getElementById('previewOverlay');p?.addEventListener('click',e=>{if(e.target===p)dispatch('close')});window.onkeydown=e=>{if(e.key==='Escape'&&state.preview!==null)dispatch('close')}}
function bindContent(){document.getElementById('payCompetence')?.addEventListener('change',e=>{payUi.competence=e.target.value;payUi.open=null;renderContent()});document.getElementById('payGroup')?.addEventListener('change',e=>{payUi.group=e.target.value;payUi.open=null;renderContent()});const paySearch=document.getElementById('paySearch');const runPaySearch=()=>{payUi.search=paySearch?.value.trim()||'';payUi.open=null;renderContent()};document.getElementById('paySearchBtn')?.addEventListener('click',runPaySearch);paySearch?.addEventListener('keydown',e=>{if(e.key==='Enter')runPaySearch()});document.getElementById('companyPick')?.addEventListener('change',e=>dispatch('company',e.target.value));document.getElementById('permissionCompany')?.addEventListener('change',e=>{state.selected=e.target.value;renderContent()});document.querySelectorAll('[data-company-toggle]').forEach(x=>x.addEventListener('change',e=>dispatch('allow-company',x.dataset.companyToggle,String(e.target.checked))));document.querySelectorAll('[data-category-toggle]').forEach(x=>x.addEventListener('change',()=>dispatch('allow-cat',state.selected,x.dataset.categoryToggle)));const search=document.getElementById('docSearch')||document.getElementById('recentSearch');const searchBtn=document.getElementById('searchBtn');const runSearch=()=>{state.search=search?.value||'';renderContent()};searchBtn?.addEventListener('click',runSearch);search?.addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});const form=document.getElementById('addForm');form?.addEventListener('submit',e=>{e.preventDefault();dispatch('add')});const folder=document.getElementById('scanFolder');folder?.addEventListener('change',e=>{const files=e.target.files;scanFolder(files);e.target.value=''});document.querySelectorAll('[data-scan-pick]').forEach(x=>x.addEventListener('change',e=>{const k=decodeURIComponent(x.dataset.scanPick);if(e.target.checked)scanSelected.add(k);else scanSelected.delete(k);renderContent()}));document.getElementById('companyAddForm')?.addEventListener('submit',e=>{e.preventDefault();addLocalCompany()});const groupField=document.getElementById('newCoGroup'),codeField=document.getElementById('newCoCode'),nameField=document.getElementById('newCoName'),folderField=document.getElementById('newCoFolder'),cnpjField=document.getElementById('newCoCnpj');
 const suggestFolder=()=>{if(folderField&&folderField.dataset.userEdited!=='yes')folderField.value=companyFolderName(groupField?.value,codeField?.value.trim().padStart(3,'0')||'',nameField?.value.trim()||'')};
 groupField?.addEventListener('change',suggestFolder);codeField?.addEventListener('input',suggestFolder);nameField?.addEventListener('input',suggestFolder);
 folderField?.addEventListener('input',()=>{folderField.dataset.userEdited='yes'});
 cnpjField?.addEventListener('blur',()=>{if(cnpjField&&cnpjField.value.replace(/\D/g,'').length===14)cnpjField.value=formatCnpj(cnpjField.value)});const ss=document.getElementById('scanSearch');const run=()=>{scanView.query=ss?.value.trim()||'';renderContent()};document.getElementById('scanSearchButton')?.addEventListener('click',run);ss?.addEventListener('keydown',e=>{if(e.key==='Enter')run()});const ts=document.getElementById('ttmSearch');const runTtmSearch=()=>{scanView.preSearch=ts?.value.trim()||'';renderContent()};document.getElementById('ttmSearchBtn')?.addEventListener('click',runTtmSearch);ts?.addEventListener('keydown',e=>{if(e.key==='Enter')runTtmSearch()})}
function addDoc(){const section=document.getElementById('addCategory').value,month=document.getElementById('addMonth').value,raw=document.getElementById('addName').value.trim(),employee=document.getElementById('addEmployee').value.trim();if(!raw)return;const filename=raw.toLowerCase().endsWith('.pdf')?raw:raw+'.pdf';const typeSection=['ADM','RES','FER'].includes(section)?section:'';const prefix=section==='GUIA'?'Guia - ':'';const title=prefix&&!/GUIA|FGTS|DARF|INSS/i.test(filename)?prefix+filename:filename;docs.unshift(createDoc(Date.now(),'exemplo'===state.selected?'exemplo':'modelo',2026,month,typeSection,title,employee));persist();state.view='home';render();notify('Documento fictício classificado e incluído no portal.')}
function simulateSync(){const c=me(),now=Date.now(),item=createDoc(now,c.id,2026,'OUTUBRO','ADM',`Admissão - Teste sincronização ${String(now).slice(-4)}.pdf`,'Funcionário Demonstrativo');docs.unshift(item);persist();renderContent();notify('Sincronização simulada: 1 novo documento em Admissões / OUTUBRO/2026.')}
async function copyDemoLink(){if(location.protocol==='file:'){notify('Esta prévia é local. O link para WhatsApp será criado após a publicação.');return}try{await navigator.clipboard.writeText(location.href.split('#')[0]);notify('Link desta demonstração copiado. Não é o portal definitivo.')}catch{notify('Copie o endereço da página pelo navegador.') }}
function downloadPdf(id){const d=docs.find(x=>x.id===id);if(!d)return;const safe=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7e]/g,'?').replace(/[()\\]/g,'\\$&');const name=safe(companies.find(c=>c.id===d.c)?.name||'Empresa');const rows=['GAV SOLUCOES CONTABEIS','DOCUMENTO DEMONSTRATIVO - SEM VALOR LEGAL','',d.title,name,`Competencia: ${docMonth(d)}/${docYear(d)}`,`Funcionario: ${d.employee||'Nao informado'}`,'','Este PDF foi gerado apenas para testar o aplicativo.','Nenhum documento real foi consultado ou baixado.'];const textStream=rows.map((r,i)=>`BT /F1 ${i<2?'14':'11'} Tf 50 ${790-i*42} Td (${safe(r)}) Tj ET\n`).join('');const objects=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',`<< /Length ${textStream.length} >>\nstream\n${textStream}endstream`];let pdf='%PDF-1.4\n',offsets=[0];objects.forEach((o,i)=>{offsets.push(pdf.length);pdf+=`${i+1} 0 obj\n${o}\nendobj\n`});const xref=pdf.length;pdf+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`;for(let i=1;i<offsets.length;i++)pdf+=`${String(offsets[i]).padStart(10,'0')} 00000 n \n`;pdf+=`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;const blob=new Blob([pdf],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='GAV-DEMO-'+d.title.replace(/[^a-zA-Z0-9\-_.]/g,'_');if(!a.download.toLowerCase().endsWith('.pdf'))a.download+='.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);notify('PDF fictício gerado para demonstração.')}
// Acesso inicial apenas para demonstração: em produção, autenticação e autorização serão feitas no servidor.
if(!sess){sess=read(LOGIN_KEY,null)||(()=>{try{return JSON.parse(sessionStorage.getItem(LOGIN_KEY))}catch{return null}})()}if(sess?.role==='admin'){sess=null;safeRemove(localStorage,LOGIN_KEY);safeRemove(sessionStorage,LOGIN_KEY)}
if(sess?.role==='client'&&!companies.some(c=>c.id===sess.c))sess=null;
render();
})();
